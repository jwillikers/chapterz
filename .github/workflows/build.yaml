name: Build
"on":
  pull_request:
    branches: ["main"]
    paths:
      - '**.nix'
      - '**.nu'
      - .github/workflows/build.yaml
      - flake.lock
      - packages/**
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - '**.nu'
      - .github/workflows/build.yaml
      - flake.lock
      - packages/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build chapterz
        run: nix build '.#chapterz'
